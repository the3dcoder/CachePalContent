# Publish a content drop — sign the registry and push the packs.
#
# WHAT THIS REPLACES. Publishing used to be a hand ceremony: export the private key into your
# shell, look up the commit, count the species, remember three environment variables, run the
# tool, commit the output, push. Every one of those steps except the counting was incidental,
# and the key being typed each time was the worst of them — a private key belongs in one place,
# not in a shell history on whichever machine happened to be nearby.
#
# HOW TO USE IT: Actions → "Publish a content drop" → Run workflow → type how many species you
# expect → go. That is the whole thing.
#
# WHY IT IS NOT PUSH-TRIGGERED, and this is the one piece of caution worth keeping. The app repo
# disabled a workflow (B395) that deployed on every push to main with no gate ladder in it at
# all — "one rename away from deploying ungated". Publishing a drop is heavier than a deploy, not
# lighter: a signed registry reaches every player's device and ids are append-only, so a wrong
# generation is permanent. This runs when a person asks it to and never on its own.
#
# WHY YOU STILL TYPE THE SPECIES COUNT. Everything else here is derived — the commit is whatever
# you ran this on, the branch is main, the previous generation comes off the live channel. The
# count is typed because generation 10's first attempt signed a SIX-species tree while eighteen
# were being published (B350), and the only thing that can catch that is a human saying what they
# meant and the machine disagreeing. A number the workflow derived from the tree would be the
# tree checking itself, which catches nothing.
name: Publish a content drop

on:
  workflow_dispatch:
    inputs:
      species_count:
        description: 'How many species should this publish? (count them — this is the check)'
        required: true
        type: string

# Two publishes at once would race on the registry. Never cancel one in flight: it writes packs
# and the registry in sequence, and a half-written drop is the thing this repo cannot undo.
concurrency:
  group: publish-drop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse without a signing key
        env:
          PALPACK_KEY: ${{ secrets.PALPACK_KEY }}
        run: |
          if [ -z "${PALPACK_KEY}" ]; then
            echo "::error::No PALPACK_KEY secret is set on this repository."
            echo "Add it once at Settings → Secrets and variables → Actions → New repository secret,"
            echo "named PALPACK_KEY, holding the private base64url value from your key file."
            echo "After that this workflow never needs it typed again."
            exit 1
          fi
          echo "signing key is present"

      - name: Validate the tree
        run: node tools/palpack.mjs validate

      - name: What is live right now
        run: |
          echo "### Before" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 30 https://the3dcoder.github.io/CachePalContent/registry.pub.json \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const p=JSON.parse(Buffer.from(JSON.parse(s).payload,'base64url').toString());
                const line='live: generation '+p.generation+', '+p.species.length+' species';
                console.log(line);
                require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line+'\n');
              });" || echo "could not read the live registry — the publish step will decide"

      - name: Sign and publish
        env:
          PALPACK_KEY: ${{ secrets.PALPACK_KEY }}
          PALPACK_EXPECT_SPECIES: ${{ inputs.species_count }}
          PALPACK_EXPECT_COMMIT: ${{ github.sha }}
        run: node tools/palpack.mjs publish

      - name: Commit and push the drop
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::publish wrote nothing. Refusing to report a drop that did not happen."
            exit 1
          fi
          git config user.name  'cachepal-content-bot'
          git config user.email 'noreply@users.noreply.github.com'
          git add -A
          git commit -m "drops: publish ${{ inputs.species_count }} species (signed by workflow run ${{ github.run_number }})"
          git push origin main

      - name: Confirm it is really live
        run: |
          echo "Waiting for GitHub Pages to serve the new registry…"
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 20 https://the3dcoder.github.io/CachePalContent/registry.pub.json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{const p=JSON.parse(Buffer.from(JSON.parse(s).payload,'base64url').toString());
                  console.log(p.generation+' '+p.species.length);}catch(e){console.log('');}});" || echo "")
            set -- $got
            if [ "${2:-}" = "${{ inputs.species_count }}" ]; then
              echo "### After"            >> "$GITHUB_STEP_SUMMARY"
              echo "live: generation $1, $2 species — published and serving" >> "$GITHUB_STEP_SUMMARY"
              echo "live: generation $1, $2 species"
              exit 0
            fi
            sleep 20
          done
          # NOT a failure of the publish — the signed bytes are pushed and Pages is eventually
          # consistent. Said plainly so nobody re-runs a drop that already landed.
          echo "::warning::Pages has not served the new registry yet. The drop IS pushed and signed;"
          echo "::warning::this step only watches the CDN. Check the URL again in a few minutes."
